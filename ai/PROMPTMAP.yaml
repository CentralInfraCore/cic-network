version: 1
context: cic-network

# Státuszok: pending | in_progress | done | blocked

entries:

  # ── Phase 1: Bootstrap ──────────────────────────────────────────────────────

  - task: "repo-bootstrap"
    status: done
    priority: 1
    milestone: bootstrap
    prompt: |
      Bootstrap cic-network repót cic-primitives@v0.1.2-ből:
        git init && git remote add base <primitives-path>
        git fetch base --tags && git merge primitives/@v0.1.2 --allow-unrelated-histories
      project.yaml, dependency.yaml, CLAUDE.md, ai/ testreszabása.
    accept: make validate
    produces:
      - project.yaml
      - dependency.yaml
      - CLAUDE.md
      - ai/

  # ── Phase 2: NetworkResource domain séma ────────────────────────────────────

  - task: "network-resource-domain"
    status: pending
    priority: 2
    milestone: domain
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre az egységes NetworkResource DomainComposition-t:
      Fájl: schemas/domain/network-resource.yaml

      config_surface (core — minden adapter):
        mtu: integer, 68..9216
        admin_state: enum [up, down]

      config_surface (capability: vlan_tagging):
        vlan_id: integer, 1..4094
        vlan_mode: enum [access, trunk, hybrid]
        allowed_vlans: list of integer (trunk mode)

      config_surface (capability: layer3):
        cidr: string (IPv4/IPv6 CIDR)
        gateway: string
        dhcp_enabled: boolean

      config_surface (capability: acl):
        security_rules: list {direction, protocol, port_range, action}

      config_surface (capability: tagging):
        tags: list {key, value}

      state_surface:
        link_state: enum [up, down, degraded, testing, unknown] — mandatory
        speed_mbps: integer — optional (capability: phy_stats)
        duplex: enum [full, half, unknown] — optional (capability: phy_stats)
        assigned_addresses: list {address, family: [ipv4, ipv6], scope: [global, link]} — optional
        rx_packets / tx_packets / rx_errors / tx_errors: integer — optional (capability: flow_telemetry)

      operation_surface:
        enable / disable: core, idempotent
        flush_mac_table: capability: vlan_tagging
        apply_acl: capability: acl

      notification_surface:
        link-state-changed: core
        address-assigned: capability: layer3
        acl-violation: capability: acl

      binding_surface:
        address: {backend}/{provider}/{location}/{id}
        backend: enum [switch, overlay, cloud]
        known_adapters: switch-adapter, hypervisor-network-adapter, cloud-network-adapter

      derivation_chain: YANG + RESTCONF + runtime dokumentálva
    accept: make validate
    produces:
      - schemas/domain/network-resource.yaml

  # ── Phase 3: Adapter contracts ──────────────────────────────────────────────

  - task: "network-adapter-contract"
    status: pending
    priority: 3
    milestone: adapter-contracts
    blocked_by: "network-resource-domain"
    prompt: |
      Definiáld az egységes network-adapter contract-ját: schemas/adapters/network-adapter.yaml
      Ez NEM implementáció — interface contract (D-004 döntés alapján).
      Minden backend (switch/overlay/cloud) ugyanazt az interface-t implementálja.
        observe: GET state → NetworkResource state_surface
        apply:   PATCH/PUT config → config_surface alkalmazása
        watch:   event stream → NotificationSurface
      known_implementations per backend:
        switch:  Juniper (NETCONF), Cisco (NETCONF/SSH), Aruba (REST)
        overlay: OVS-VSCTL, Linux bridge/iproute2, Proxmox network API
        cloud:   AWS VPC API, GCP VPC API, Azure VNet API, stb.
    accept: make validate
    produces:
      - schemas/adapters/network-adapter.yaml

  # ── Phase 4: Első signed release ────────────────────────────────────────────

  - task: "signed-release"
    status: pending
    priority: 6
    milestone: release
    blocked_by: "cloud-network-adapter-contract"
    prompt: |
      Hozd létre az első signed release artifact-ot.
      Release branch: network/releases/v0.1.0
      make release → network/@v0.1.0 tag
    accept: make validate && git tag -l "network/@v*"
    checks:
      - make validate
      - git tag -l "network/@v*"
