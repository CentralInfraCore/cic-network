schema_version: "1"
dependencies:
  - name: base-repo
    source: github.com/CentralInfraCore/base-repo
    tag: base@0.5.0
    mode: remote-merge
    purpose: repository-contract
    imported_paths:
      - .github/
      - Makefile
      - mk/
      - tools/
      - docker-compose.yml
      - Dockerfile
      - docs/
      - features/
      - tests/
      - project.yaml
      - project.schema.yaml
      - md.meta.schema.yaml
      - requirements.in
      - requirements.txt
      - renovate.json
      - LICENSE.md
      - LICENSE.yaml
      - LICENSE.meta.yaml
      - README.md
      - feature-list.md

  - name: cic-primitives
    source: github.com/CentralInfraCore/cic-primitives
    tag: primitives/@v0.1.5
    mode: remote-merge
    purpose: primitive-schema-base
    imported_paths:
      - schemas/atomic/
      - schemas/aggregate/
      - schemas/index.yaml
      - dependencies/

  - name: cic-yang
    source: github.com/CentralInfraCore/cic-yang
    tag: yang/@v0.1.3
    mode: reference
    purpose: yang-building-blocks
    referenced_blocks:
      - ietf-interfaces-base
      - ietf-interfaces-physical
      - ietf-interfaces-logical
      - ietf-interfaces-vlan
      - ietf-interfaces-tunnel
      - ietf-ip-v4
      - ietf-ip-v6
      - ietf-lldp
