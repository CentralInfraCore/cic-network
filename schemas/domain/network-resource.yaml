---
metadata:
  name: NetworkResource
  version: v0.0.dev
  description: >
    Egységes hálózati erőforrás — managed switch port, overlay (OVS/bridge), és cloud
    hálózati objektum (VPC subnet, security group, route table) egyaránt leírható.
    A paradigma (layer2/layer3/cloud) az adapter és az address rétegben van,
    nem a config_surface-ben. Az adapter deklarálja a támogatott capability-ket.
  owner: Gabor Zoltan Sinko
  tags:
    - domain-composition
    - network
  validatedBy:
    name: cic-primitives
    version: v0.1.2

spec:
  kind: DomainComposition
  base:
    aggregate: ManagedEntity
    ref: schemas/aggregate/managed-entity.yaml

  # ── PolicySurface — Access atom alapú jogosultság ────────────────────────────
  policy_surface:
    default_access: open
    default_modify: owner
    surface_rules:
      - surface: state_surface
        modify: [OU=adapters,O=cic]
      - surface: config_surface
        access: [O=owner]
        modify: [O=owner]
    inherit_policy: true

  # ── Identity ─────────────────────────────────────────────────────────────────
  identity:
    atomic_ref: schemas/atomic/identity.yaml
    kind: NetworkResource
    namespace: "cic:network"
    version: v0.1.dev
    base: "cic:core:ManagedEntity"
    abstract: false
    description: Platform-agnosztikus hálózati erőforrás

  # ── ConfigSurface ─────────────────────────────────────────────────────────────
  config_surface:
    aggregate_ref: schemas/aggregate/config-surface.yaml
    nodes:

      # ── Core: minden adapter ──────────────────────────────────────────────────
      - name: mtu
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        default: 1500
        description: Maximum Transmission Unit (byte)
        contract:
          - type: range
            expression: "68..9216"

      - name: admin_state
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: config
        mandatory: true
        description: Kívánt adminisztrációs állapot
        contract:
          - type: enum
            expression: [up, down]

      # capability: vlan_tagging ─────────────────────────────────────────────────
      - name: vlan_id
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: config
        optional: true
        capability: vlan_tagging
        description: VLAN azonosító (access mode)
        contract:
          - type: range
            expression: "1..4094"

      - name: vlan_mode
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: vlan_tagging
        description: Port VLAN működési mód
        contract:
          - type: enum
            expression: [access, trunk, hybrid]

      - name: allowed_vlans
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: vlan_tagging
        description: Engedélyezett VLAN-ok trunk mode esetén
        item_fields:
          - name: vlan_id
            shape_type: scalar
            scalar_type: integer
            role: key

      # capability: layer3 ──────────────────────────────────────────────────────
      - name: cidr
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: layer3
        description: IP prefix (IPv4 vagy IPv6 CIDR, pl. 10.0.0.0/24)

      - name: gateway
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: config
        optional: true
        capability: layer3
        description: Default gateway IP cím

      - name: dhcp_enabled
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: boolean
        role: config
        optional: true
        default: false
        capability: dhcp
        description: DHCP server/relay engedélyezve

      # capability: acl ─────────────────────────────────────────────────────────
      - name: security_rules
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: acl
        description: Tűzfal szabályok (ingress/egress)
        item_fields:
          - name: direction
            shape_type: scalar
            scalar_type: string
            role: key
            contract:
              - type: enum
                expression: [ingress, egress]
          - name: protocol
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [tcp, udp, icmp, any]
          - name: port_range
            shape_type: scalar
            scalar_type: string
            optional: true
            description: Port tartomány (pl. 80, 443, 8000-9000)
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [allow, deny]

      # capability: tagging ─────────────────────────────────────────────────────
      - name: tags
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: collection
        collection_variant: list
        role: config
        optional: true
        capability: tagging
        description: Platform tag-ek (cost allocation, environment stb.)
        item_fields:
          - name: key
            shape_type: scalar
            scalar_type: string
            role: key
          - name: value
            shape_type: scalar
            scalar_type: string

  # ── StateSurface ──────────────────────────────────────────────────────────────
  state_surface:
    aggregate_ref: schemas/aggregate/state-surface.yaml
    source: network-adapter
    freshness:
      ttl: 30s
      strategy: event-driven
    nodes:

      - name: link_state
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: state
        mandatory: true
        description: >
          Aktuális kapcsolati állapot — adapter normalizálja a platform értékeket.
          degraded: részleges hiba (pl. CRC hibák küszöb felett, half-duplex mismatch).
          testing: loopback teszt folyamatban, forgalom szünetel.
        contract:
          - type: enum
            expression: [up, down, degraded, testing, unknown]

      - name: assigned_addresses
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: collection
        collection_variant: list
        role: state
        optional: true
        description: Kiosztott IP címek
        item_fields:
          - name: address
            shape_type: scalar
            scalar_type: string
            role: key
          - name: family
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [ipv4, ipv6]
          - name: scope
            shape_type: scalar
            scalar_type: string
            optional: true
            contract:
              - type: enum
                expression: [global, link, host]

      # capability: phy_stats ───────────────────────────────────────────────────
      - name: speed_mbps
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: phy_stats
        description: Aktuális port sebesség Mbps-ban

      - name: duplex
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: string
        role: operational
        optional: true
        capability: phy_stats
        contract:
          - type: enum
            expression: [full, half, unknown]

      # capability: flow_telemetry ──────────────────────────────────────────────
      - name: rx_packets
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: flow_telemetry

      - name: tx_packets
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: flow_telemetry

      - name: rx_errors
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: flow_telemetry

      - name: tx_errors
        atomic_ref: schemas/atomic/shape.yaml
        shape_type: scalar
        scalar_type: integer
        role: operational
        optional: true
        capability: flow_telemetry

  # ── OperationSurface ──────────────────────────────────────────────────────────
  operation_surface:
    aggregate_ref: schemas/aggregate/operation-surface.yaml
    operations:

      # ── Core: minden adapter ──────────────────────────────────────────────────
      - name: enable
        atomic_ref: schemas/atomic/behavior.yaml
        type: action
        idempotent: true
        description: Interface/erőforrás adminisztrációs engedélyezése
        input: null
        output:
          - name: link_state
            shape_type: scalar
            scalar_type: string

      - name: disable
        atomic_ref: schemas/atomic/behavior.yaml
        type: action
        idempotent: true
        description: Interface/erőforrás adminisztrációs tiltása
        input: null
        output:
          - name: link_state
            shape_type: scalar
            scalar_type: string

      # capability: vlan_tagging ────────────────────────────────────────────────
      - name: flush_mac_table
        atomic_ref: schemas/atomic/behavior.yaml
        type: action
        idempotent: false
        capability: vlan_tagging
        description: MAC cím tábla ürítése (switch porton)
        input: null
        output: null

      # capability: acl ─────────────────────────────────────────────────────────
      - name: apply_acl
        atomic_ref: schemas/atomic/behavior.yaml
        type: operation
        idempotent: true
        capability: acl
        description: ACL szabálylista alkalmazása
        input:
          - name: rules
            shape_type: collection
            collection_variant: list
            mandatory: true
        output:
          - name: applied_count
            shape_type: scalar
            scalar_type: integer

  # ── NotificationSurface ───────────────────────────────────────────────────────
  notification_surface:
    events:
      - name: link-state-changed
        atomic_ref: schemas/atomic/event.yaml
        trigger: state_change
        severity: info
        description: Kapcsolati állapot megváltozott
        payload:
          - name: previous_state
            shape_type: scalar
            scalar_type: string
          - name: current_state
            shape_type: scalar
            scalar_type: string

      # capability: layer3
      - name: address-assigned
        atomic_ref: schemas/atomic/event.yaml
        trigger: state_change
        severity: info
        capability: layer3
        description: IP cím kiosztva vagy visszavonva
        payload:
          - name: address
            shape_type: scalar
            scalar_type: string
          - name: family
            shape_type: scalar
            scalar_type: string
          - name: action
            shape_type: scalar
            scalar_type: string
            contract:
              - type: enum
                expression: [assigned, released]

      # capability: acl
      - name: acl-violation
        atomic_ref: schemas/atomic/event.yaml
        trigger: explicit
        severity: warning
        capability: acl
        description: ACL szabály által tiltott forgalom detektálva
        payload:
          - name: direction
            shape_type: scalar
            scalar_type: string
          - name: src_address
            shape_type: scalar
            scalar_type: string
          - name: dst_address
            shape_type: scalar
            scalar_type: string
          - name: protocol
            shape_type: scalar
            scalar_type: string

      # capability: flow_telemetry
      - name: error-threshold-exceeded
        atomic_ref: schemas/atomic/event.yaml
        trigger: threshold
        severity: warning
        capability: flow_telemetry
        description: Hibaszámláló küszöböt átlépett
        payload:
          - name: counter
            shape_type: scalar
            scalar_type: string
          - name: value
            shape_type: scalar
            scalar_type: integer

  # ── BindingSurface ────────────────────────────────────────────────────────────
  binding_surface:
    addresses:
      - atomic_ref: schemas/atomic/address.yaml
        schema_path: "/cic-network:resources/resource={backend},{provider},{location},{id}"
        api_path: "/restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}"
        logical_id: "cic:network:{backend}:{provider}:{location}:{id}"
        namespace: "cic:network"
        key_fields:
          - name: backend
            type: enum
            values: [switch, overlay, cloud]
          - name: provider
            type: string
            description: >
              Ki kezeli az erőforrást — routing kulcs az adapter kiválasztásához.
              switch: fizikai switch azonosítója (pl. juniper-01, cisco-core)
              overlay: hypervisor/bridge azonosítója (pl. proxmox-01, ovs-cluster)
              cloud: enum [aws, gcp, azure, hcloud, do, ovh, oci]
          - name: location
            type: string
            description: >
              Hol fut az erőforrás.
              switch: rack/panel azonosítója vagy interface path (pl. rack-a)
              overlay: hypervisor hoszt vagy "-" ha a hypervisor kezeli
              cloud: provider region (pl. eu-central-1) — kötelező
          - name: id
            type: string
            description: >
              Erőforrás egyedi azonosítója.
              switch: interface neve (pl. ge-0/0/1, Gi1/0/1)
              overlay: bridge/port neve (pl. vmbr0, tap-vm100)
              cloud: cloud erőforrás ID (pl. subnet-0abc123, sg-0xyz789)
    adapter: network-adapter
    adapter_capabilities:
      description: >
        Az adapter deklarálja a támogatott capability-ket a binding rétegben.
        A schema felsorolja az összeset — az adapter szűri le, amit tud kezelni.
      known_adapters:
        - name: switch-adapter
          backend: switch
          provider: "<switch-id>"
          capabilities: [vlan_tagging, acl, phy_stats]
        - name: hypervisor-network-adapter
          backend: overlay
          provider: "<hypervisor-id>"
          capabilities: [vlan_tagging, layer3, dhcp, flow_telemetry]
        - name: cloud-network-adapter
          backend: cloud
          provider: [aws, gcp, azure, hcloud, do, ovh, oci]
          capabilities: [layer3, dhcp, acl, nat, tagging]

# ── Levezetési lánc ───────────────────────────────────────────────────────────
derivation_chain:

  yang:
    module: cic-network
    namespace: "urn:cic:network"
    content: |
      module cic-network {
        namespace "urn:cic:network";
        prefix cic-n;

        list resource {
          key "backend provider location id";
          leaf backend  { type enumeration { enum switch; enum overlay; enum cloud; } }
          leaf provider { type string; }
          leaf location { type string; }
          leaf id       { type string; }

          container config {
            leaf mtu          { type uint16; default 1500; }
            leaf admin-state  { type enumeration { enum up; enum down; } mandatory true; }
            leaf vlan-id      { type uint16; }
            leaf vlan-mode    { type enumeration { enum access; enum trunk; enum hybrid; } }
            list allowed-vlans {
              key vlan-id;
              leaf vlan-id { type uint16; }
            }
            leaf cidr         { type string; }
            leaf gateway      { type string; }
            leaf dhcp-enabled { type boolean; default false; }
            list security-rules {
              key "direction protocol";
              leaf direction  { type enumeration { enum ingress; enum egress; } }
              leaf protocol   { type enumeration { enum tcp; enum udp; enum icmp; enum any; } }
              leaf port-range { type string; }
              leaf action     { type enumeration { enum allow; enum deny; } }
            }
            list tags {
              key key;
              leaf key   { type string; }
              leaf value { type string; }
            }
          }

          container state {
            config false;
            leaf link-state { type enumeration { enum up; enum down; enum degraded; enum testing; enum unknown; } }
            leaf speed-mbps { type uint32; }
            leaf duplex     { type enumeration { enum full; enum half; enum unknown; } }
            leaf rx-packets { type uint64; }
            leaf tx-packets { type uint64; }
            leaf rx-errors  { type uint64; }
            leaf tx-errors  { type uint64; }
            list assigned-addresses {
              key address;
              leaf address { type string; }
              leaf family  { type enumeration { enum ipv4; enum ipv6; } }
              leaf scope   { type enumeration { enum global; enum link; enum host; } }
            }
          }

          action enable  { output { leaf link-state { type string; } } }
          action disable { output { leaf link-state { type string; } } }
          action flush-mac-table { }
          action apply-acl {
            input  { anydata rules; }
            output { leaf applied-count { type uint32; } }
          }

          notification link-state-changed {
            leaf previous-state { type string; }
            leaf current-state  { type string; }
          }
          notification address-assigned {
            leaf address { type string; }
            leaf family  { type string; }
            leaf action  { type enumeration { enum assigned; enum released; } }
          }
          notification acl-violation {
            leaf direction   { type string; }
            leaf src-address { type string; }
            leaf dst-address { type string; }
            leaf protocol    { type string; }
          }
        }
      }

  restconf:
    collection: "GET /restconf/data/cic-network:resources"
    instance:   "GET /restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}"
    config:
      read:   "GET   /restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}/config"
      update: "PUT   /restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}/config"
      patch:  "PATCH /restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}/config"
    state:
      read:   "GET   /restconf/data/cic-network:resources/resource={backend},{provider},{location},{id}/state"
    operations:
      enable:          "POST /restconf/operations/cic-network:resources/resource={backend},{provider},{location},{id}/enable"
      disable:         "POST /restconf/operations/cic-network:resources/resource={backend},{provider},{location},{id}/disable"
      flush_mac_table: "POST /restconf/operations/cic-network:resources/resource={backend},{provider},{location},{id}/flush-mac-table"
      apply_acl:       "POST /restconf/operations/cic-network:resources/resource={backend},{provider},{location},{id}/apply-acl"
    events:
      stream: "GET /restconf/streams/cic-network-events"

  runtime:
    reconcile_loop: |
      1. observe:   adapter.get(backend, provider, location, id) → state_surface
      2. compare:   diff(config_surface, state_surface) → drift?
      3. if drift:
           admin_state wrong  → enable/disable
           vlan_id changed    → adapter reconfigures port VLAN
           cidr changed       → adapter updates subnet prefix (cloud) or interface address (overlay)
           security_rules changed → apply_acl
      4. emit:      capability-specifikus events ha adapter jelzi
    adapter_note: >
      A link_state normalizálása az adapter feladata:
        switch: JUNOS 'present'+'up' → up, 'absent' → down
        overlay: OVS port state → up/down
        cloud: AWS 'available' → up, 'pending' → unknown
