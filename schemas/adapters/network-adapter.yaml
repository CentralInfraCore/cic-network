---
metadata:
  name: NetworkAdapter
  version: v0.0.dev
  description: >
    Egységes network adapter interface contract — switch port, overlay (OVS/bridge) és
    cloud hálózati erőforrás egyaránt implementálja. Ez NEM implementáció: az adapter
    implementáció dönti el a protokollt (NETCONF, OVS-VSCTL, cloud API). A backend enum
    azonosítja az erőforrás típusát, a capabilities lista szűri le a ténylegesen
    támogatott funkciókat.
  owner: Gabor Zoltan Sinko
  tags:
    - adapter-contract
    - network
  validatedBy:
    name: cic-primitives
    version: v0.1.2

spec:
  kind: AdapterContract
  domain: "cic:network:NetworkResource"

  # ── Scope ─────────────────────────────────────────────────────────────────────
  backends:
    - name: switch
      description: Fizikai managed switch — Juniper, Cisco, Aruba, stb.
      protocol_examples: [NETCONF, RESTCONF, SSH/CLI]
    - name: overlay
      description: Szoftveres bridge / overlay hálózat — OVS, Linux bridge, Proxmox
      protocol_examples: [OVS-VSCTL, iproute2, Proxmox API]
    - name: cloud
      description: Cloud hálózati erőforrás — VPC subnet, security group, route table
      protocol_examples: [AWS VPC API, GCP VPC API, Azure VNet API]
      known_providers: [aws, gcp, azure, hcloud, do, ovh, oci]

  # ── Interface contract ────────────────────────────────────────────────────────
  operations:
    - name: observe
      description: >
        Erőforrás aktuális állapotának lekérdezése — visszaad egy NetworkResource
        state_surface-t. Az adapter normalizálja a platform-specifikus értékeket
        (pl. JUNOS 'present'+'up' → link_state: up).
      input:
        - name: backend
          type: string
        - name: provider
          type: string
        - name: location
          type: string
        - name: id
          type: string
      output:
        ref: NetworkResource.state_surface

    - name: apply
      description: >
        Config alkalmazása az erőforrásra — a config_surface mezőit az adapter
        fordítja le platform-specifikus parancsokra. Idempotens: az adapter
        ellenőrzi az aktuális állapotot és csak a diff-et alkalmazza.
      input:
        ref: NetworkResource.config_surface
      output:
        - name: applied
          type: boolean
        - name: diff_summary
          type: string
          optional: true

    - name: watch
      description: >
        Folyamatos állapotfigyelés — az adapter értesítést küld ha a state_surface
        változik. A Relay ezt feliratkozással kezeli.
      input:
        - name: backend
          type: string
        - name: provider
          type: string
        - name: location
          type: string
        - name: id
          type: string
      output:
        stream: true
        ref: NetworkResource.notification_surface

  # ── Capability deklaráció ─────────────────────────────────────────────────────
  capability_declaration:
    description: >
      Az adapter implementáció a binding során deklarálja a támogatott capability-ket.
      A NetworkResource schema felsorolja az összeset — az adapter szűri le amit tud.
    known_implementations:
      - backend: switch
        examples:
          - name: juniper-netconf
            capabilities: [vlan_tagging, acl, phy_stats]
          - name: cisco-netconf
            capabilities: [vlan_tagging, acl, phy_stats]
      - backend: overlay
        examples:
          - name: ovs-adapter
            capabilities: [vlan_tagging, layer3, flow_telemetry]
          - name: proxmox-network
            capabilities: [vlan_tagging, layer3, dhcp]
      - backend: cloud
        examples:
          - name: aws-vpc
            capabilities: [layer3, dhcp, acl, nat, tagging]
          - name: gcp-vpc
            capabilities: [layer3, dhcp, acl, nat, tagging]
          - name: azure-vnet
            capabilities: [layer3, dhcp, acl, nat, tagging]
